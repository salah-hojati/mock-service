<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Mock Service Configuration (No Request Body)</title>
    <script type="text/javascript">
        // --- SOLUTION: The function now accepts the ID of a hidden input ---
        function copyFromHiddenInput(elementId) {
            debugger;
            // Find the hidden input element by its ID
            console.log(elementId);
            const hiddenInputElement = document.getElementById(elementId);
            if (!hiddenInputElement) {
                console.error('Could not find element with ID:', elementId);
                return;
            }

            const textToCopy = hiddenInputElement.innerText;
            console.log(textToCopy);
            // Check if the modern Clipboard API is available and usable
            if (navigator.clipboard &amp;&amp; window.isSecureContext) {
                // Use the modern API in secure contexts (HTTPS / localhost)
                navigator.clipboard.writeText(textToCopy).then(function () {
                    showCopySuccess();
                }, function (err) {
                    console.error('Could not copy text with Clipboard API: ', err);
                    // If the modern API fails for any reason, try the fallback
                    fallbackCopyText(textToCopy);
                });
            } else {
                // Fallback for insecure contexts (HTTP on non-localhost) or older browsers
                fallbackCopyText(textToCopy);
            }
        }

        function fallbackCopyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;

            // Keep it on-screen but invisible — do NOT use display:none or left:-9999px on mobile
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.width = '2em';
            textarea.style.height = '2em';
            textarea.style.padding = '0';
            textarea.style.border = 'none';
            textarea.style.outline = 'none';
            textarea.style.boxShadow = 'none';
            textarea.style.background = 'transparent';
            textarea.style.opacity = '0';

            // Prevent iOS keyboard from popping up
            textarea.setAttribute('readonly', '');

            document.body.appendChild(textarea);

            // Save and restore any existing selection
            const selection = document.getSelection();
            const originalRange = selection.rangeCount > 0 ? selection.getRangeAt(0) : null;

            textarea.select();
            textarea.setSelectionRange(0, text.length);   // needed on iOS

            let succeeded = false;
            try {
                succeeded = document.execCommand('copy');
            } catch (e) {
                console.error('execCommand copy threw:', e);
            }

            document.body.removeChild(textarea);
            if (originalRange &amp;&amp; selection) {
                selection.removeAllRanges();
                selection.addRange(originalRange);
            }

            if (succeeded) {
                showCopySuccess();
            } else {
                showCopyError('Fallback copy command was unsuccessful.');
            }
        }

        function showCopySuccess() {
            PF('copyGrowl').show([{
                summary: 'Copied to Clipboard',
                detail: 'The content has been copied successfully.',
                severity: 'info'
            }]);
        }

        function showCopyError(detailMessage) {
            PF('copyGrowl').show([{
                summary: 'Copy Failed',
                detail: detailMessage || 'Could not copy content to clipboard. See console for details.',
                severity: 'error'
            }]);
        }


    </script>
    <style type="text/css">
        /* --- General Page Scrolling --- */
        /* This ensures the main body has a scrollbar if content is too long */
        body {
            overflow-y: scroll;
        }

        /* --- Reusable CSS for Dialog Scrolling --- */
        .dialog-scrollable-content {
            max-height: 70vh; /* Max height is 70% of the browser window height */
            overflow-y: auto; /* Add vertical scrollbar only when needed */
            padding-right: 10px; /* Prevent scrollbar from overlapping content */
        }

        .ui-datatable textarea {
            width: 95% !important;
        }

        .ui-dialog textarea {
            width: 95% !important;
        }

        .curl-command {
            background-color: #2d2d2d;
            color: #cccccc;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }


    </style>
</h:head>

<h:body>
    <div class="card">
        <h:form id="form">
            <p:growl id="messages" showDetail="true"/>

            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="New" icon="pi pi-plus" actionListener="#{mockConfigBeanByUrl.openNew}"
                                     update=":form:dialogContentWrapper"
                                     oncomplete="PF('manageConfigDialog').show()"/>
                </p:toolbarGroup>
            </p:toolbar>
            <p:dataTable id="dt-configs" widgetVar="dtConfigs" var="config" value="#{mockConfigBeanByUrl.configs}"
                         rowKey="#{config.id}" resizableColumns="true"
                         rows="10" paginator="true" paginatorPosition="bottom"  scrollable="true"  scrollHeight="600">

                <p:ajax event="rowSelect" update=":form:dialogContentWrapper"
                        oncomplete="PF('manageConfigDialog').show()"/>

                <p:column headerText="Method" sortBy="#{config.httpMethod}" style="width:1rem;">
                    <h:outputText value="#{config.httpMethod}"/>
                </p:column>
                <p:column headerText="ID" sortBy="#{config.id}" style="width:1rem">
                    <h:outputText value="#{config.id}"/>
                </p:column>
                <p:column headerText="URL Pattern" sortBy="#{config.urlPattern}" style="width:10%"   >
                    <h:outputText value="#{config.urlPattern}" id="urlText"  style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;"/>
                    <p:tooltip for="urlText" value="#{config.urlPattern}"
                               showDelay="0" hideDelay="0"/>
                </p:column>

                <!-- ADD THIS COLUMN TO THE DATATABLE -->
                <p:column headerText="Captured Request" style="width:40%">
                    <p:inputTextarea readonly="true" rows="3" value="#{config.capturedRequestPayload}"
                                     style="resize: none; overflow: auto; width: 600px; max-height: 120px; height: auto;"
                    />
                </p:column>

                <p:column headerText="Response Payload" style="width:40%">
                    <p:inputTextarea readonly="true" cols="10" rows="3" value="#{config.responsePayload}"
                                     style="resize: none; overflow: auto; width: 600px; max-height: 120px; height: auto;"
                    />
                </p:column>
                <p:column headerText="Delay (ms)" sortBy="#{config.delayMs}" style="width:1rem; text-align:right;">
                    <h:outputText value="#{config.delayMs}"/>
                </p:column>
                <p:column headerText="Status" sortBy="#{config.httpStatusCode}" style="width:1rem; text-align:center;">
                    <h:outputText value="#{config.httpStatusCode}"/>
                </p:column>
                <p:column headerText="Description"><h:outputText value="#{config.description}"/></p:column>
                <p:column style="width:1rem;text-align: center">
                    <p:commandButton icon="pi pi-pencil" title="Edit Rule"
                                     actionListener="#{mockConfigBeanByUrl.setSelectedConfig(config)}"
                                     update=":form:dialogContentWrapper"
                                     oncomplete="PF('manageConfigDialog').show()"
                                     styleClass="rounded-button ui-button-success"
                                     process="@this"/>
                </p:column>
                <p:column style="width:1rem;text-align: center">

                    <p:commandButton icon="pi pi-code" title="Generate Curl Command"
                                     actionListener="#{mockConfigBeanByUrl.generateCurl(config)}"
                                     update=":form:curl-dialog-content :form:hiddenCurlCommand"
                                     oncomplete="PF('curlDialog').show()"
                                     styleClass="rounded-button ui-button-secondary"
                                     process="@this"
                    >
                    </p:commandButton>
                </p:column>

            </p:dataTable>

            <!-- Dialog for Editing/Creating -->
            <p:dialog header="Configuration Details" widgetVar="manageConfigDialog" modal="true" showEffect="fade"
                      hideEffect="fade" resizable="false">
                <p:outputPanel id="dialogContentWrapper" styleClass="dialog-scrollable-content">
                    <p:outputPanel id="manage-config-content" class="ui-fluid">
                        <p:outputPanel rendered="#{not empty mockConfigBeanByUrl.selectedConfig}">
                            <div class="p-field">
                                <p:outputLabel for="httpMethod">HTTP Method</p:outputLabel>
                                <p:selectOneMenu id="httpMethod" value="#{mockConfigBeanByUrl.selectedConfig.httpMethod}"
                                                 required="true">
                                    <f:selectItems value="#{mockConfigBeanByUrl.httpMethods}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="p-field">
                                <p:outputLabel for="urlPattern">URL Pattern</p:outputLabel>
                                <p:inputText id="urlPattern" value="#{mockConfigBeanByUrl.selectedConfig.urlPattern}"
                                             required="true"/>
                            </div>

                            <!-- ADD THIS FIELD TO THE DIALOG (READ-ONLY) -->
                            <div class="p-field">
                                <p:outputLabel
                                        for="capturedPayload">Captured Request Payload (Last Call)</p:outputLabel>
                                <p:inputTextarea id="capturedPayload"
                                                 value="#{mockConfigBeanByUrl.selectedConfig.capturedRequestPayload}"
                                                 readonly="true" rows="6" cols="80" autoResize="false"/>
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="responsePayload">Response Payload (Output)</p:outputLabel>
                                <p:inputTextarea id="responsePayload"
                                                 value="#{mockConfigBeanByUrl.selectedConfig.responsePayload}"
                                                 required="true" rows="10" cols="80" autoResize="false"/>
                            </div>
                            <div class="p-field">
                                <p:outputLabel for="delay">Delay (ms)</p:outputLabel>
                                <p:inputNumber id="delay" value="#{mockConfigBeanByUrl.selectedConfig.delayMs}" minValue="0"
                                               decimalPlaces="0" required="true"
                                               title="The time in milliseconds to wait before sending the response."/>
                            </div>
                            <div class="p-field">
                                <p:outputLabel for="status">HTTP Status Code</p:outputLabel>
                                <p:inputNumber id="status" value="#{mockConfigBeanByUrl.selectedConfig.httpStatusCode}"
                                               decimalPlaces="0" required="true"
                                               title="The HTTP status code to return (e.g., 200, 404, 500)."/>
                            </div>
                            <div class="p-field">
                                <p:outputLabel for="description">Description</p:outputLabel>
                                <p:inputTextarea id="description" value="#{mockConfigBeanByUrl.selectedConfig.description}"
                                                 rows="3"/>
                            </div>
                        </p:outputPanel>
                    </p:outputPanel>
                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton value="Save" icon="pi pi-check"
                                     actionListener="#{mockConfigBeanByUrl.saveConfig}"
                                     update=":form:dt-configs :form:messages"
                                     oncomplete="if (!args.validationFailed) { PF('manageConfigDialog').hide(); }"
                                     process="manage-config-content @this"/>
                    <p:commandButton value="Save for soap" icon="pi pi-check"
                                     actionListener="#{mockConfigBeanByUrl.saveConfigForSoap}"
                                     update=":form:dt-configs :form:messages"
                                     oncomplete="if (!args.validationFailed) { PF('manageConfigDialog').hide(); }"
                                     process="manage-config-content @this"/>
                    <p:commandButton value="Delete" icon="pi pi-trash" styleClass="ui-button-danger"
                                     actionListener="#{mockConfigBeanByUrl.deleteConfig}"
                                     process="@this"

                    >
                        <p:confirm header="Confirmation" message="Are you sure you want to delete this record?"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                    <p:commandButton value="Cancel" icon="pi pi-times" onclick="PF('manageConfigDialog').hide()"
                                     class="ui-button-secondary"/>
                </f:facet>
            </p:dialog>

            <!-- Dialog to display the curl command -->
            <p:dialog header="Curl Command" widgetVar="curlDialog" modal="true" width="600" showEffect="fade"
                      hideEffect="fade">
                <p:outputPanel id="curl-dialog-content" styleClass="dialog-scrollable-content">
                    <p>You can use the following command to test this mock endpoint:</p>
                    <div class="curl-command">
                        <h:outputText  id ="CurlCommand" value="#{mockConfigBeanByUrl.generatedCurlCommand}"/>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Copy Command" icon="pi pi-copy" type="button"
                                     onclick="copyFromHiddenInput('form:CurlCommand')"
                                     styleClass="ui-button-info"/>
                    <p:commandButton value="Close" icon="pi pi-times" onclick="PF('curlDialog').hide()"
                                     class="ui-button-secondary"/>
                </f:facet>
            </p:dialog>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes"/>
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/>
            </p:confirmDialog>
            <h:inputHidden id="hiddenCurlCommand" value="#{mockConfigBeanByUrl.curlCommandToCopy}"/>
        </h:form>
    </div>
</h:body>
</html>
