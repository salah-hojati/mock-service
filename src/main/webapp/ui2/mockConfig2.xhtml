<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Mock Configs 2</title>
    <style>
        .ui-toolbar {
            border: none !important;
            background: #f8f9fa !important;
            padding: 10px !important;
            border-radius: 4px !important;
        }
        .ui-datatable {
            margin-top: 10px;
        }
        .ui-dialog-content {
            padding: 20px !important;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        .action-buttons .ui-button {
            margin: 0 !important;
        }
        .captured-payload {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            max-height: 150px;
            overflow: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</h:head>
<h:body>
    <h:form id="formMockByURL" prependId="false">
        <p:messages id="messagesUrl" showDetail="true" closable="true" redisplay="false"
                    autoUpdate="true" style="margin-bottom:10px;" />

        <p:toolbar>
            <p:toolbarGroup>
                <p:commandButton value="New" action="#{mockConfigBeanByUrlNew.openNew()}"
                                 icon="pi pi-plus" update="@form"
                                 oncomplete="PF('manageConfigDialogUrl').show()" />
            </p:toolbarGroup>
    <p:toolbarGroup align="right">
        <p:selectOneMenu id="categorySelectUrl"
                         style="width:200px;">
            <f:selectItem itemLabel="All Categories" itemValue="" />
            <f:selectItems value="#{mockConfigBeanByUrlNew.categories}" var="cat"
                           itemLabel="#{cat.name}" itemValue="#{cat.id}" />
        </p:selectOneMenu>

        <!-- Filter Button -->
        <p:commandButton value="Filter"
                         icon="pi pi-search"
                         style="margin-left:5px;"
                         action="#{mockConfigBeanByUrlNew.filterByCategoryWithParam()}"
                         onclick="applyFilter(); return false;" />
    </p:toolbarGroup>

    <script type="text/javascript">
        function applyFilter() {
            // Read combo value
            var select = document.getElementById('categorySelectUrl');
            var categoryId = select ? select.value : '';

            console.log('Selected category ID: ' + categoryId);

            // Pass to remoteCommand
            filterRemote([{name: 'categoryId', value: categoryId}]);
        }
    </script>
        </p:toolbar>

        <p:dataTable id="dt-configsUrl" var="config" value="#{mockConfigBeanByUrlNew.configs}"
                     selection="#{mockConfigBeanByUrlNew.selectedConfig}" selectionMode="single"
                     rowKey="#{config.id}" style="margin-top:10px;"
                     paginator="true" rows="10"
                     paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     rowsPerPageTemplate="5,10,20,50">

            <p:column headerText="ID" style="width:50px;">
                <h:outputText value="#{config.id}" />
            </p:column>

            <p:column headerText="Method" style="width:80px;">
                <h:outputText value="#{config.httpMethod}" />
            </p:column>

            <p:column headerText="URL Pattern">
                <h:outputText value="#{config.urlPattern}" />
            </p:column>

            <p:column headerText="Category">
                <h:outputText value="#{mockConfigBeanByUrlNew.getCategoryName(config.category.id)}"
                              rendered="#{config.category != null}" />
                <h:outputText value="-" rendered="#{config.category == null}" />
            </p:column>

            <p:column headerText="Status" style="width:80px;">
                <h:outputText value="#{config.httpStatusCode}" />
            </p:column>

            <p:column headerText="Delay" style="width:80px;">
                <h:outputText value="#{config.delayMs}ms" />
            </p:column>
             <p:column headerText="Actions" style="width:120px; text-align:center;">
                 <div class="action-buttons">
                                        <p:commandButton icon="pi pi-check" title="Select"
                                                           action="#{mockConfigBeanByUrlNew.setSelectedConfig(config)}"
                                                          update="@form"
                                                          ajax="false"
                                                          rendered="#{mockConfigBeanByUrlNew.selectedConfig == null or mockConfigBeanByUrlNew.selectedConfig.id != config.id}" />

                     <p:commandButton icon="pi pi-code" title="Generate Curl Command"
                                      actionListener="#{mockConfigBeanByUrlNew.generateCurl(config)}"
                                      update="@form"
                                      oncomplete="PF('curlDialogUrl').show()"
                                      styleClass="rounded-button ui-button-secondary"
                                      process="@this"
                                      rendered="#{mockConfigBeanByUrlNew.selectedConfig != null and mockConfigBeanByUrlNew.selectedConfig.id== config.id}" />


                     <p:commandButton icon="pi pi-pencil" title="Edit"
                                                 action="#{mockConfigBeanByUrlNew.selectAndEdit(config)}"
                                                 update="@form"
                                                 ajax="true"
                                                 oncomplete="PF('manageConfigDialogUrl').show()"
                                               rendered="#{mockConfigBeanByUrlNew.selectedConfig != null and mockConfigBeanByUrlNew.selectedConfig.id== config.id}" />

                                         <p:commandButton icon="pi pi-trash" title="Delete"
                                                          action="#{mockConfigBeanByUrlNew.deleteConfig}"
                                                          update="@form"
                                                          ajax="false"
                                                          onclick="return confirm('Are you sure you want to delete this config?')"
                                                          rendered="#{mockConfigBeanByUrlNew.selectedConfig != null and mockConfigBeanByUrlNew.selectedConfig.id== config.id}" />
                             </div>
                         </p:column>

        </p:dataTable>

        <!-- Manage Dialog -->
        <p:dialog id="manageConfigDialogUrl" header="Manage Mock Configuration"
                  widgetVar="manageConfigDialogUrl" modal="true"
                  resizable="false" width="800" height="auto"
                  closeOnEscape="true" closable="true">
            <p:outputPanel id="manage-config-contentUrl" style="padding:5px;">
                <!-- FIX: Added rendered check to prevent null errors -->
                <div >
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                        <div>
                            <p:outputLabel for="httpMethodUrl" value="HTTP Method" />
                            <p:selectOneMenu id="httpMethodUrl" value="#{mockConfigBeanByUrlNew.selectedConfig.httpMethod}"
                                             style="width:100%;"
                                             rendered="#{mockConfigBeanByUrlNew.requestBodyApplicable}">
                                <f:selectItems value="#{mockConfigBeanByUrlNew.httpMethods}" />
                            </p:selectOneMenu>
                        </div>
                        <div>
                            <p:outputLabel for="urlPatternUrl" value="URL Pattern" />
                            <p:inputText id="urlPatternUrl" value="#{mockConfigBeanByUrlNew.selectedConfig.urlPattern}"
                                         style="width:100%;"
                                         rendered="#{mockConfigBeanByUrlNew.requestBodyApplicable}"/>
                        </div>
                    </div>

                    <div style="margin-top:10px;">
                        <p:outputLabel for="categoryUrl" value="Category" />
                        <p:selectOneMenu id="categoryUrl" value="#{mockConfigBeanByUrlNew.selectedCategoryId}"
                                         style="width:100%;">
                            <f:selectItem itemLabel="No Category" itemValue="" />
                            <f:selectItems value="#{mockConfigBeanByUrlNew.categories}" var="cat"
                                           itemLabel="#{cat.name}" itemValue="#{cat.id}" />
                        </p:selectOneMenu>
                    </div>

                <div style="margin-top:10px;">
                    <p:outputLabel for="responsePayloadUrl" value="Response Payload (JSON)" />
                    <p:inputTextarea id="responsePayloadUrl" value="#{mockConfigBeanByUrlNew.selectedConfig.responsePayload}"
                                     style="width:100%; height:150px;"
                                     rendered="#{mockConfigBeanByUrlNew.requestBodyApplicable}"
                    />
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:10px;">
                    <div>
                        <p:outputLabel for="statusCodeUrl" value="HTTP Status Code" />
                        <p:inputText id="statusCodeUrl" value="#{mockConfigBeanByUrlNew.selectedConfig.httpStatusCode}"
                                     style="width:100%;" required="true"
                                     rendered="#{mockConfigBeanByUrlNew.requestBodyApplicable}"
                        />
                    </div>
                    <div>
                        <p:outputLabel for="delayMsUrl" value="Delay (ms)" />
                        <p:inputText id="delayMsUrl" value="#{mockConfigBeanByUrlNew.selectedConfig.delayMs}"
                                     rendered="#{mockConfigBeanByUrlNew.requestBodyApplicable}"
                                     style="width:100%;" />
                    </div>
                </div>

                <div style="margin-top:10px;">
                    <p:outputLabel for="descriptionUrl" value="Description" />
                    <p:inputTextarea id="descriptionUrl" value="#{mockConfigBeanByUrlNew.selectedConfig.description}"
                                     style="width:100%; height:60px;"
                                     rendered="#{mockConfigBeanByUrlNew.requestBodyApplicable}"/>
                </div>

                <!-- Show captured payload in edit dialog (read-only) -->
                <div style="margin-top:10px;">
                    <p:outputLabel value="Captured Request Payload" />
                    <div class="captured-payload">
                        <h:outputText value="#{mockConfigBeanByUrlNew.selectedConfig.capturedRequestPayload}" />
                    </div>
                </div>
                </div>

                <p:separator style="margin:15px 0;" />

                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                    <p:commandButton value="Cancel" onclick="PF('manageMockDialog').hide()" />
                    <p:commandButton value="Save" action="#{mockConfigBeanByUrlNew.saveConfig()}"
                                     styleClass="ui-button-success"
                                     update="@form"
                                     ajax="false"
                    />
                </div>
            </p:outputPanel>
        </p:dialog>

        <!-- cURL Dialog -->
        <p:dialog id="curlDialogUrl" header="cURL Command" widgetVar="curlDialogUrl"
                  modal="true" resizable="false" width="700" height="auto"
                  closeOnEscape="true" closable="true">
            <p:outputPanel id="curl-dialog-contentUrl"  style="padding:5px;">
                <p:inputTextarea id="curlCommandToCopyUrl" value="#{mockConfigBeanByUrlNew.curlCommandToCopy}"
                                 style="width:100%; height:200px; font-family:monospace;font-size:12px;"
                                 readonly="true" />
                <p:separator style="margin:15px 0;" />
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
                    <p:commandButton value="Copy to Clipboard" icon="pi pi-copy"
                                     onclick="copyToClipboard('curlCommandToCopyUrl')" />
                    <p:commandButton value="Close" onclick="PF('curlDialogUrl').hide()" />
                </div>
            </p:outputPanel>
        </p:dialog>
    </h:form>

    <!-- JavaScript for copy to clipboard -->
    <script type="text/javascript">
        function copyToClipboard(elementId) {
            var textarea = document.getElementById(elementId);
            if (textarea) {
                textarea.select();
                document.execCommand('copy');
                alert('Copied to clipboard!');
            }
        }
    </script>
</h:body>
</html>
