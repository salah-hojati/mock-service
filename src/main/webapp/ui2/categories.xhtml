<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Manage Categories</title>
    <style>
        .ui-toolbar {
            border: none !important;
            background: #f8f9fa !important;
            padding: 10px !important;
            border-radius: 4px !important;
        }
        .ui-datatable {
            margin-top: 10px;
        }
        .ui-dialog-content {
            padding: 20px !important;
        }
        .color-preview {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 3px;
            margin-right: 8px;
            border: 1px solid #ddd;
        }
        .count-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
        }
        .count-badge-blue { background: #e3f2fd; }
        .count-badge-purple { background: #f3e5f5; }
        .count-badge-green { background: #e8f5e9; }
    </style>
</h:head>
<h:body>
    <h:form id="catForm">
        <p:messages id="messages" showDetail="true" closable="true" redisplay="false"
                    autoUpdate="true" style="margin-bottom:10px;" />

        <p:toolbar>
            <p:toolbarGroup>
                <p:commandButton value="New Category" action="#{categoryBean.openNew()}"
                                 icon="pi pi-plus"
                                 update="@form"
                                 oncomplete="PF('categoryDialog').show()" />
            </p:toolbarGroup>
            <p:toolbarGroup align="right">
                <h:outputText value="Total Categories: #{categoryBean.categories.size()}"
                              style="font-weight:bold; color:#666;" />
            </p:toolbarGroup>
        </p:toolbar>

        <p:dataTable id="category-table" var="cat" value="#{categoryBean.categories}"
                     rowKey="#{cat.id}" style="margin-top:10px;"
                     paginator="true" rows="10"
                     paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     rowsPerPageTemplate="5,10,20,50"
                     rowStyleClass="#{categoryBean.selectedCategory != null and categoryBean.selectedCategory.id == cat.id ? 'selected-row' : ''}">

            <p:column headerText="Name" style="width:200px;">
                <span class="color-preview" style="background:#{cat.color};"></span>
                <h:outputText value="#{cat.name}" />
            </p:column>

            <p:column headerText="Description">
                <h:outputText value="#{cat.description}" />
            </p:column>

            <p:column headerText="Mock Configs" style="width:120px; text-align:center;">
                <span class="count-badge count-badge-blue">
                    <h:outputText value="#{cat.mockConfigs.size()}" />
                </span>
            </p:column>

            <p:column headerText="Mock Configs 2" style="width:120px; text-align:center;">
                <span class="count-badge count-badge-purple">
                    <h:outputText value="#{cat.mockConfigs2.size()}" />
                </span>
            </p:column>

            <p:column headerText="Gateway Configs" style="width:120px; text-align:center;">
                <span class="count-badge count-badge-green">
                    <h:outputText value="#{cat.gatewayConfigs.size()}" />
                </span>
            </p:column>

            <!-- Actions Column - Shows only when row is selected -->
            <p:column headerText="Actions" style="width:120px; text-align:center;">
                <div class="action-buttons">
                    <!-- Clock button - visible when NO row is selected OR this row is NOT selected -->
                    <p:commandButton icon="pi pi-check" title="Select"
                                     action="#{categoryBean.selectCategory(cat)}"
                                     update="@form"
                                     ajax="false"
                                     rendered="#{categoryBean.selectedCategory == null or categoryBean.selectedCategory.id != cat.id}" />

                    <!-- Edit button - visible only when THIS row is selected -->
                    <p:commandButton icon="pi pi-pencil" title="Edit"
                                     action="#{categoryBean.selectAndEdit(cat)}"
                                     update="@form"
                                     ajax="true"
                                     oncomplete="PF('categoryDialog').show()"
                                     rendered="#{categoryBean.selectedCategory != null and categoryBean.selectedCategory.id == cat.id}" />

                    <!-- Delete button - visible only when THIS row is selected -->
                    <p:commandButton icon="pi pi-trash" title="Delete"
                                     action="#{categoryBean.deleteCategory(cat)}"
                                     update="@form"
                                     ajax="false"
                                     onclick="return confirm('Are you sure you want to delete this category?')"
                                     disabled="#{cat.mockConfigs.size() > 0 or cat.mockConfigs2.size() > 0 or cat.gatewayConfigs.size() > 0}"
                                     rendered="#{categoryBean.selectedCategory != null and categoryBean.selectedCategory.id == cat.id}" />
                </div>
            </p:column>
        </p:dataTable>

        <p:dialog id="categoryDialog" header="Manage Category" widgetVar="categoryDialog"
                  modal="true" resizable="false" width="550" height="auto"
                  closeOnEscape="true" closable="true">

            <div style="display:grid; gap:15px; padding:10px;">
                <div>
                    <p:outputLabel for="catName" value="Category Name *" />
                    <p:inputText id="catName" value="#{categoryBean.newCategory.name}"
                                 style="width:100%;"
                                 placeholder="Enter category name" />
                    <p:message for="catName" />
                </div>

                <div>
                    <p:outputLabel for="catColor" value="Color" />
                    <div style="display:flex; align-items:center; gap:10px;">
                        <p:colorPicker id="catColor" value="#{categoryBean.newCategory.color}"
                                       style="width:100%;" />
                        <span class="color-preview" style="background:#{categoryBean.newCategory.color}; width:30px; height:30px;"></span>
                    </div>
                </div>

                <div>
                    <p:outputLabel for="catDesc" value="Description" />
                    <p:inputTextarea id="catDesc" value="#{categoryBean.newCategory.description}"
                                     style="width:100%; height:80px;"
                                     placeholder="Optional description" />
                </div>
            </div>

            <p:separator style="margin:15px 0;" />

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                <p:commandButton value="Cancel" onclick="PF('categoryDialog').hide()" />
                <p:commandButton value="Save" action="#{categoryBean.saveCategory()}"
                                 styleClass="ui-button-success"
                                 ajax="false"
                                 update="@form"
                                 oncomplete="if (!args.validationFailed) PF('categoryDialog').hide()" />
            </div>

        </p:dialog>
    </h:form>
</h:body>
</html>
