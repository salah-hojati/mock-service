<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"

      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Mock Configs</title>
    <style>
        .ui-toolbar {
            border: none !important;
            background: #f8f9fa !important;
            padding: 10px !important;
            border-radius: 4px !important;
        }
        .ui-datatable {
            margin-top: 10px;
        }
        .ui-dialog-content {
            padding: 20px !important;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        .action-buttons .ui-button {
            margin: 0 !important;
        }
    </style>
</h:head>
<h:body>
    <h:form id="formMockByInput" prependId="false">
        <p:messages id="messages" showDetail="true" closable="true" redisplay="false"
                   autoUpdate="true" style="margin-bottom:10px;" />

        <p:toolbar>
            <p:toolbarGroup>
                <p:commandButton value="New" action="#{mockConfigBeanByInputNew.openNew()}"
                                 icon="pi pi-plus" update="@form"
                                 oncomplete="PF('manageConfigDialog').show()" />

            </p:toolbarGroup>

            <p:toolbarGroup align="right">
                <!-- Define remoteCommand -->


                <!-- Combo Box -->
                <p:selectOneMenu id="categorySelect"
                                 style="width:200px;">
                    <f:selectItem itemLabel="All Categories" itemValue="" />
                    <f:selectItems value="#{mockConfigBeanByInputNew.categories}" var="cat"
                                   itemLabel="#{cat.name}" itemValue="#{cat.id}" />
                </p:selectOneMenu>

                <!-- Filter Button -->
                <p:commandButton value="Filter"
                                 icon="pi pi-search"
                                 style="margin-left:5px;"
                                 action="#{mockConfigBeanByInputNew.filterByCategoryWithParam()}"
                                 onclick="applyFilter(); return false;" />
            </p:toolbarGroup>

            <script type="text/javascript">
                function applyFilter() {
                    // Read combo value
                    var select = document.getElementById('categorySelect');
                    var categoryId = select ? select.value : '';

                    console.log('Selected category ID: ' + categoryId);

                    // Pass to remoteCommand
                    filterRemote([{name: 'categoryId', value: categoryId}]);
                }
            </script>
        </p:toolbar>



        <p:dataTable id="dt-configs" var="config" value="#{mockConfigBeanByInputNew.configs}"
                     selection="#{mockConfigBeanByInputNew.selectedConfig}" selectionMode="single"
                     rowKey="#{config.id}" style="margin-top:10px;"
                     paginator="true" rows="10"
                     paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     rowsPerPageTemplate="5,10,20,50">

            <p:column headerText="ID" style="width:50px;">
                <h:outputText value="#{config.id}" />
            </p:column>

            <p:column headerText="Method" style="width:80px;">
                <h:outputText value="#{config.httpMethod}" />
            </p:column>

            <p:column headerText="URL Pattern">
                <h:outputText value="#{config.urlPattern}" />
            </p:column>

            <p:column headerText="Category">
                <h:outputText value="#{mockConfigBeanByInputNew.getCategoryName(config.category.id)}"
                              rendered="#{config.category != null}" />
                <h:outputText value="-" rendered="#{config.category == null}" />
            </p:column>

            <p:column headerText="Status" style="width:80px;">
                <h:outputText value="#{config.httpStatusCode}" />
            </p:column>

            <p:column headerText="Delay" style="width:80px;">
                <h:outputText value="#{config.delayMs}ms" />
            </p:column>
             <p:column headerText="Actions" style="width:120px; text-align:center;">
                 <div class="action-buttons">
                                        <p:commandButton icon="pi pi-check" title="Select"
                                                           action="#{mockConfigBeanByInputNew.setSelectedConfig(config)}"
                                                          update="@form"
                                                          ajax="false"
                                                          rendered="#{mockConfigBeanByInputNew.selectedConfig == null or mockConfigBeanByInputNew.selectedConfig.id != config.id}" />

                     <p:commandButton icon="pi pi-code" title="Generate Curl Command"
                                      actionListener="#{mockConfigBeanByInputNew.generateCurl(config)}"
                                      update="@form"
                                      oncomplete="PF('curlDialog').show()"
                                      styleClass="rounded-button ui-button-secondary"
                                      process="@this"
                                      rendered="#{mockConfigBeanByInputNew.selectedConfig != null and mockConfigBeanByInputNew.selectedConfig.id== config.id}" />


                     <p:commandButton icon="pi pi-pencil" title="Edit"
                                                 action="#{mockConfigBeanByInputNew.selectAndEdit(config)}"
                                                 update="@form"
                                                 ajax="true"
                                                 oncomplete="PF('manageConfigDialog').show()"
                                               rendered="#{mockConfigBeanByInputNew.selectedConfig != null and mockConfigBeanByInputNew.selectedConfig.id== config.id}" />

                                         <p:commandButton icon="pi pi-trash" title="Delete"
                                                          action="#{mockConfigBeanByInputNew.deleteConfig}"
                                                          update="@form"
                                                          ajax="false"
                                                          onclick="return confirm('Are you sure you want to delete this config?')"
                                                          rendered="#{mockConfigBeanByInputNew.selectedConfig != null and mockConfigBeanByInputNew.selectedConfig.id== config.id}" />
                             </div>
                         </p:column>

            <!--            <p:column headerText="Actions" style="width:120px;">-->

<!--                                     update="@form"-->
<!--                                     ajax="false"-->
<!--                                     rendered="#{categoryBean.selectedCategory == null or categoryBean.selectedCategory.id != cat.id}" />-->

<!--                    &lt;!&ndash; Edit button - visible only when THIS row is selected &ndash;&gt;-->
<!--                    <p:commandButton icon="pi pi-pencil" title="Edit"-->
<!--                                     action="#{categoryBean.selectAndEdit(cat)}"-->
<!--                                     update="@form"-->
<!--                                     ajax="true"-->
<!--                                     oncomplete="PF('categoryDialog').show()"-->

<!--                    &lt;!&ndash; Delete button - visible only when THIS row is selected &ndash;&gt;-->
<!--                    <p:commandButton icon="pi pi-trash" title="Delete"-->

<!--                                     update="@form"-->
<!--                                     ajax="false"-->

<!--                                     rendered="#{categoryBean.selectedCategory != null and categoryBean.selectedCategory.id == cat.id}" />-->
<!--                </div>-->
<!--            </p:column>-->
        </p:dataTable>

        <!-- Manage Dialog -->
        <p:dialog id="manageConfigDialog" header="Manage Mock Configuration"
                  widgetVar="manageConfigDialog" modal="true"
                  resizable="false" width="800" height="auto"
                  closeOnEscape="true" closable="true">
            <p:outputPanel id="manage-config-content" style="padding:5px;">
                <!-- FIX: Added rendered check to prevent null errors -->
                <div >
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                        <div>
                            <p:outputLabel for="httpMethod" value="HTTP Method" />
                            <p:selectOneMenu id="httpMethod" value="#{mockConfigBeanByInputNew.selectedConfig.httpMethod}"
                                             style="width:100%;">
                                <f:selectItems value="#{mockConfigBeanByInputNew.httpMethods}" />
                            </p:selectOneMenu>
                        </div>
                        <div>
                            <p:outputLabel for="urlPattern" value="URL Pattern" />
                            <p:inputText id="urlPattern" value="#{mockConfigBeanByInputNew.selectedConfig.urlPattern}"
                                         style="width:100%;"  />
                        </div>
                    </div>

                    <div style="margin-top:10px;">
                        <p:outputLabel for="category" value="Category" />
                        <p:selectOneMenu id="category" value="#{mockConfigBeanByInputNew.selectedCategoryId}"
                                         style="width:100%;">
                            <f:selectItem itemLabel="No Category" itemValue="" />
                            <f:selectItems value="#{mockConfigBeanByInputNew.categories}" var="cat"
                                           itemLabel="#{cat.name}" itemValue="#{cat.id}" />
                        </p:selectOneMenu>
                    </div>

                    <div style="margin-top:10px;">
                        <p:outputLabel for="requestPayload" value="Request Payload (JSON)"
                                       rendered="#{mockConfigBeanByInputNew.requestBodyApplicable}" />
                        <p:inputTextarea id="requestPayload" value="#{mockConfigBeanByInputNew.selectedConfig.requestPayload}"
                                         style="width:100%; height:100px;"
                                         rendered="#{mockConfigBeanByInputNew.requestBodyApplicable}" />
                    </div>

                    <div style="margin-top:10px;">
                        <p:outputLabel for="responsePayload" value="Response Payload (JSON)" />
                        <p:inputTextarea id="responsePayload" value="#{mockConfigBeanByInputNew.selectedConfig.responsePayload}"
                                         style="width:100%; height:150px;" />
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:10px;">
                        <div>
                            <p:outputLabel for="statusCode" value="HTTP Status Code" />
                            <p:inputText id="statusCode" value="#{mockConfigBeanByInputNew.selectedConfig.httpStatusCode}"
                                         style="width:100%;"  />
                        </div>
                        <div>
                            <p:outputLabel for="delayMs" value="Delay (ms)" />
                            <p:inputText id="delayMs" value="#{mockConfigBeanByInputNew.selectedConfig.delayMs}"
                                         style="width:100%;" />
                        </div>
                    </div>

                    <div style="margin-top:10px;">
                        <p:outputLabel for="description" value="Description" />
                        <p:inputTextarea id="description" value="#{mockConfigBeanByInputNew.selectedConfig.description}"
                                         style="width:100%; height:60px;" />
                    </div>
                </div>

                <p:separator style="margin:15px 0;" />

                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                    <p:commandButton value="Cancel" onclick="PF('manageConfigDialog').hide()" />
                    <p:commandButton value="Save" action="#{mockConfigBeanByInputNew.saveConfig()}"
                                     styleClass="ui-button-success"
                                     update="@form"
                                     ajax="false"
                    />
                </div>
            </p:outputPanel>
        </p:dialog>

        <!-- cURL Dialog -->
        <p:dialog id="curlDialog" header="cURL Command" widgetVar="curlDialog"
                  modal="true" resizable="false" width="700" height="auto"
                  closeOnEscape="true" closable="true">
            <p:outputPanel id="curl-dialog-content" style="padding:5px;">
                <p:inputTextarea id="curlCommandToCopy" value="#{mockConfigBeanByInputNew.curlCommandToCopy}"
                                 style="width:100%; height:200px; font-family:monospace; font-size:12px;"
                                 readonly="true" />
                <p:separator style="margin:15px 0;" />
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
                    <p:commandButton value="Copy to Clipboard" icon="pi pi-copy"
                                     onclick="copyToClipboard('curlCommandToCopy')" />
                    <p:commandButton value="Close" onclick="PF('curlDialog').hide()" />
                </div>
            </p:outputPanel>
        </p:dialog>
    </h:form>

    <!-- JavaScript for copy to clipboard -->
    <script type="text/javascript">
        function copyToClipboard(elementId) {
            var textarea = document.getElementById(elementId);
            if (textarea) {
                textarea.select();
                document.execCommand('copy');
                alert('Copied to clipboard!');
            }
        }
    </script>
</h:body>
</html>
